name: e2e
# Manually-triggered pre-release gate, not a per-push/PR check: a full multi-variant native iOS
# build-and-test pass (vision-camera, executorch, the Shopify checkout sheet kit are all native
# modules) is slow and needs a macOS runner, so it doesn't belong on every push. Run it from the
# Actions tab before cutting a release; treat any job failure as a release blocker.
#
# "demo" hits the LIVE Shopify Storefront (real browsing + a real cart create/update, never a
# completed order — see docs/ops/e2e.md) and needs network; it leaves a throwaway cart behind
# in the live store on every run, by design.
#
# Xcode/Swift version caveat (found authoring this locally, HAG-231): a freshly-installed,
# very new Xcode/Swift toolchain can fail to compile expo-modules-jsi (a Swift-compiler-version
# incompatibility upstream of this app, not fixable here). The "Pin Xcode" step below pins an
# exact, documented Xcode version from GitHub's own macos-15 runner image install list
# (https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md) — well
# below the Swift 6.4 line that breaks locally — and fails clearly if that path is ever missing
# (Toby review finding 3, HAG-231), rather than guessing "whatever's newest" at run time.
#
# See docs/ops/e2e.md for what each variant covers and why separate builds are needed.
on:
  workflow_dispatch: {}
jobs:
  maestro-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [demo, shopify-offline, camera-demo, camera-demo-fixture]
    env:
      # Only "demo" needs real Shopify credentials to build (shopify-offline swaps the host at
      # build time; camera-demo/camera-demo-fixture force everything offline) - wire these three
      # as repo/org secrets, under exactly these names, before enabling this job for "demo".
      EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN }}
      EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
      EXPO_PUBLIC_SHOPIFY_CHECKOUT_HOSTS: ${{ secrets.EXPO_PUBLIC_SHOPIFY_CHECKOUT_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode 16.4 below the Swift 6.4 expo-modules-jsi break (HAG-231)
        # Exact version, not a "newest/next-newest" guess (Toby review finding 3, HAG-231).
        # 16.4 is macos-15's own documented DEFAULT Xcode as of this writing, per the "Xcode"
        # section of: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
        # That list also carries 16.0-16.4 and the newer 26.x line; 16.4 is comfortably below
        # the Swift 6.4.2 toolchain (Xcode 27.x locally) that fails to compile expo-modules-jsi
        # (docs/ops/e2e.md). If GitHub's runner image drops 16.4, this step fails clearly
        # (rather than silently building with an untested toolchain) — re-check that Xcode
        # section and update XCODE_PATH below, and the version named in this comment.
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_16.4.app/Contents/Developer"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Expected Xcode 16.4 at $XCODE_PATH but it is not installed on this runner." >&2
            echo "Check the current macos-15 Xcode list and update this pin:" >&2
            echo "https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md" >&2
            echo "Installed Xcode versions on this runner:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Ensure an iOS Simulator runtime exists
        run: xcrun simctl list runtimes | grep -q "iOS" || xcodebuild -downloadPlatform iOS
      - name: Run variant
        run: bash scripts/e2e/run-maestro.sh ${{ matrix.variant }} "iPhone 17"
