name: e2e
# Manually-triggered pre-release gate, not a per-push/PR check: a full multi-variant native iOS
# build-and-test pass (vision-camera, executorch, the Shopify checkout sheet kit are all native
# modules) is slow and needs a macOS runner, so it doesn't belong on every push. Run it from the
# Actions tab before cutting a release; treat any job failure as a release blocker.
#
# "demo" hits the LIVE Shopify Storefront (real browsing + a real cart create/update, never a
# completed order — see docs/ops/e2e.md) and needs network; it leaves a throwaway cart behind
# in the live store on every run, by design.
#
# Xcode/Swift version caveat (found authoring this locally, HAG-231): a freshly-installed,
# very new Xcode/Swift toolchain can fail to compile expo-modules-jsi (a Swift-compiler-version
# incompatibility upstream of this app, not fixable here). The "Pin Xcode" step below selects an
# older-than-newest Xcode on the runner for exactly this reason — if a build step still fails
# with a Swift "C function pointer" error, that heuristic guessed wrong; hardcode the pin to a
# specific Xcode path instead (see the step's own comment).
#
# See docs/ops/e2e.md for what each variant covers and why separate builds are needed.
on:
  workflow_dispatch: {}
jobs:
  maestro-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [demo, shopify-offline, camera-demo, camera-demo-fixture]
    env:
      # Only "demo" needs real Shopify credentials to build (shopify-offline swaps the host at
      # build time; camera-demo/camera-demo-fixture force everything offline) - wire these three
      # as repo/org secrets, under exactly these names, before enabling this job for "demo".
      EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN }}
      EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
      EXPO_PUBLIC_SHOPIFY_CHECKOUT_HOSTS: ${{ secrets.EXPO_PUBLIC_SHOPIFY_CHECKOUT_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode below the Swift 6.4 expo-modules-jsi break (HAG-231)
        # Don't wait to find out whether macos-15's *current* default Xcode carries the
        # Swift 6.4.2 incompatibility documented in docs/ops/e2e.md — pin explicitly.
        # macos-15 runners ship several Xcode versions side by side specifically so a job
        # can select an older one (full list: https://github.com/actions/runner-images).
        # Heuristic: assume the newest installed Xcode is the one most likely to carry the
        # just-released, broken Swift toolchain, so pick the next-newest instead. If that
        # guess is wrong (the break moves, or the runner image changes), replace this with
        # an explicit `sudo xcode-select -s /Applications/Xcode_<version>.app/Contents/Developer`
        # pin and update the comment above.
        run: |
          echo "Xcode installs on this runner:"
          ls -d /Applications/Xcode*.app
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -2 | head -1)
          echo "Selecting: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Ensure an iOS Simulator runtime exists
        run: xcrun simctl list runtimes | grep -q "iOS" || xcodebuild -downloadPlatform iOS
      - name: Run variant
        run: bash scripts/e2e/run-maestro.sh ${{ matrix.variant }} "iPhone 17"
