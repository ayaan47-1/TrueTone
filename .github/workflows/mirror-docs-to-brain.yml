name: mirror-docs-to-brain

# One-way sync: this app repo is the engineering source of truth. On every push to main that
# touches CLAUDE.md, docs/**, or README.md, mirror those files into the truetone-brain Obsidian
# vault under engineering/ (a read-only mirror). Never edit engineering/ in the vault by hand.
#
# Requires a repo secret BRAIN_SYNC_TOKEN: a fine-grained PAT (or deploy key) with
# Contents: Read & Write on ayaan47-1/truetone-brain. See the workflow PR / README for setup.

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/mirror-docs-to-brain.yml'
  workflow_dispatch: {}

concurrency:
  group: mirror-docs-to-brain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo (source)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout brain vault (target)
        uses: actions/checkout@v4
        with:
          repository: ayaan47-1/truetone-brain
          token: ${{ secrets.BRAIN_SYNC_TOKEN }}
          path: brain

      - name: Rebuild engineering/ mirror
        run: |
          set -euo pipefail
          DEST="brain/engineering"
          rm -rf "$DEST"
          mkdir -p "$DEST/docs"
          cp app/CLAUDE.md "$DEST/CLAUDE.md"
          cp app/README.md "$DEST/README.md"
          rsync -a --delete app/docs/ "$DEST/docs/"
          cat > "$DEST/_AUTOGENERATED.md" <<'EOF'
          # ⚠️ Auto-mirrored — do not edit here

          These files are a **read-only mirror** of the [TrueTone app repo](https://github.com/ayaan47-1/TrueTone),
          synced by the `mirror-docs-to-brain` GitHub Action on every push to `main`.

          Edit them in the **app repo** (`CLAUDE.md`, `docs/**`, `README.md`) — any change made here
          will be overwritten on the next sync.
          EOF

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          cd brain
          git config user.name  "truetone-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A engineering
          if git diff --cached --quiet; then
            echo "No doc changes to mirror."
            exit 0
          fi
          SHA="${GITHUB_SHA::7}"
          git commit -m "sync(engineering): mirror app-repo docs @ ${SHA}"
          git push origin HEAD:main
