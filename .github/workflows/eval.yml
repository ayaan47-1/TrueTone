name: eval

# Port of the `eval` job in .gitlab-ci.yml — the fairness/invariance benchmark
# harness. .gitlab-ci.yml recorded it as 518s of the old suite's 596s (87%,
# measured 2026-08-07); a real run on GitHub's runners today (2026-09-16)
# matches that closely: 21 suites / 121 tests, 595.559s of jest execution
# alone, ~622s wall-clock including checkout/npm ci. One file,
# eval/invariance/__tests__/axes.test.ts, is ~595s of that by itself. It is a
# benchmark, not a unit test.
#
# Trigger is a deliberate match of GitLab's, not a default: GitLab's `eval`
# job runs only `if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH` (a branch
# pipeline on main — i.e. push to main, not merge-request pipelines) plus a
# manual `if: $CI_PIPELINE_SOURCE == "web"` trigger. It deliberately does not
# run on every push/PR the way `jest` does, since ~10 minutes is too long for
# that. `push: branches: [main]` + `workflow_dispatch` mirrors that exactly —
# no `pull_request` trigger here, unlike compliance.yml.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Fairness/invariance eval harness
    runs-on: ubuntu-latest
    # No --forceExit: investigated whether an early near-timeout was a real
    # post-test hang. Ran the suite with --detectOpenHandles under a widened
    # 40-min budget and it passed clean, 21/21 suites, 121/121 tests, zero
    # handles reported — https://github.com/ayaan47-1/TrueTone/actions/runs/35066862347.
    # There is nothing to force-exit past.
    #
    # Sizing: axes.test.ts, the heaviest file, has been measured at 595s,
    # 1037s, 1065s, and 1066s across separate runs on GitHub's shared
    # runners — with and without --detectOpenHandles, so that flag is not
    # the variable (an earlier version of this comment blamed it; that was
    # wrong, corrected 2026-09-16 after the first real push-to-main run took
    # 1068s with no flag at all, same range as the diagnostic runs). The
    # spread is CPU variance on a shared runner for a CPU-bound benchmark,
    # roughly 1.8x between the fast and slow ends observed so far. The first
    # real run on main passed at 18m21s wall-clock against the old 20-minute
    # timeout — under 2 minutes of headroom, enough for a normal run to turn
    # main red on a false alarm. 35 minutes absorbs that variance without
    # letting a genuine hang sit forever.
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Run fairness/invariance eval
        run: npm run test:eval
