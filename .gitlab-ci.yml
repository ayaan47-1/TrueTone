# GitLab CI port of .github/workflows/compliance.yml.
#
# Both files must stay in step: the repo lives on GitHub and GitLab, and each CI
# system ignores the other's config. scripts/__tests__/gitlab-ci-parity.test.mjs
# fails the build if a command exists in one and not the other, and
# gitlab-ci-shape.test.mjs pins the job layout below.
#
# GitHub Actions is free and unlimited for public repos; GitLab's free tier bills
# against a monthly compute allowance. That asymmetry drives the layout: the cheap
# gates run first and jest, which is ~90% of the runtime, only runs if they pass.

# GitHub's `on: [push, pull_request]` has no single GitLab equivalent. Without
# rules, a push to a branch with an open merge request queues two pipelines —
# one for the branch, one for the MR — each paying a full npm ci. This is
# GitLab's canonical fix: prefer the MR pipeline, fall back to the branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - test

.node:
  # Pinned to the same Node major as the GitHub workflow's setup-node step.
  image: node:22
  # The project auto-cancels redundant pipelines, but that only stops *running*
  # jobs that opt in. Without this, pushing again during a jest run pays for both.
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  # GitLab clones the repo automatically, so there is no checkout step to port.
  before_script:
    - npm ci --cache .npm --prefer-offline

# Everything that answers in seconds. Failing here skips the jest stage entirely,
# which is the whole point: a copy violation should cost ~2 minutes, not ~17.
guard:
  extends: .node
  stage: check
  script:
    # Build fails if any ad/analytics SDK reaches the data path, or if the marketing
    # copy in web/ drifts across the cosmetic/medical line (CLAUDE.md §1).
    - npm run check:compliance
    - npm run check:no-egress
    # Jest only collects .ts/.tsx, so the node:test suites covering the compliance
    # scripts and the waitlist client need their own step or they never run.
    - npm run test:scripts

# The expensive one: ~750 tests across ~135 suites, several minutes of it.
# Integration tests need a live Supabase and run separately.
#
# Scoped to merge requests and main rather than every push. This job is ~90% of a
# ~20 minute pipeline, and the free tier allows 400 compute-min/month — a day of
# ordinary feature-branch pushes consumed a quarter of that. GitHub Actions is
# disabled account-wide, so this is the only place the suite runs: it must still
# gate everything that lands, which MRs plus the default branch covers. `guard`
# stays unconditional, so a feature-branch push still gets the compliance gates
# in ~2 minutes.
jest:
  extends: .node
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm test

# Port of .github/workflows/mirror-docs-to-brain.yml. One-way sync: this repo is
# the engineering source of truth, and engineering/ in the vault is a read-only
# mirror. The GitHub workflow syncs to github.com/ayaan47-1/truetone-brain; this
# one syncs to the GitLab copy, so each remote's vault matches its own repo.
#
# Requires a CI/CD variable BRAIN_SYNC_TOKEN: a GitLab PAT or project access
# token with write_repository on ayaanahmedkhan12/truetone-brain. Mark it Masked
# so it is redacted from job logs, and Protected only if main is a protected
# branch — a Protected variable is absent on unprotected refs and the job would
# fail to authenticate.
mirror-docs:
  # Reuses the node image the other jobs already pull; it only needs git.
  image: node:22
  stage: check
  # The GitHub mirror is a separate workflow and does not wait on compliance.
  # needs: [] preserves that instead of queueing it behind the jest stage.
  needs: []
  # GitHub uses concurrency with cancel-in-progress: false. Two syncs racing
  # would push conflicting vault commits.
  resource_group: mirror-docs-to-brain
  # A half-finished mirror is worse than a late one, so this job is not
  # interruptible even though the others are.
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - CLAUDE.md
        - README.md
        - docs/**/*
        - .gitlab-ci.yml
    # Equivalent of workflow_dispatch: offered on demand, never automatic.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  variables:
    BRAIN_PROJECT: ayaanahmedkhan12/truetone-brain
    VAULT_DIR: brain
  script:
    - test -n "$BRAIN_SYNC_TOKEN" || { echo "BRAIN_SYNC_TOKEN is not set"; exit 1; }
    # Token reaches git only through expansion of a masked variable; never echoed.
    - git clone --depth 1 "https://oauth2:${BRAIN_SYNC_TOKEN}@gitlab.com/${BRAIN_PROJECT}.git" "$VAULT_DIR"
    - DEST="$VAULT_DIR/engineering"
    # Rebuild rather than merge, so a file deleted here disappears there too.
    - rm -rf "$DEST"
    - mkdir -p "$DEST/docs"
    - cp CLAUDE.md "$DEST/CLAUDE.md"
    - cp README.md "$DEST/README.md"
    # cp -a, not rsync --delete: the tree was just removed, so there is nothing
    # to delete, and rsync is not in this image.
    - cp -a docs/. "$DEST/docs/"
    - |
      cat > "$DEST/_AUTOGENERATED.md" <<'EOF'
      # ⚠️ Auto-mirrored — do not edit here

      These files are a **read-only mirror** of the TrueTone app repo, synced by the
      `mirror-docs` GitLab CI job on every push to the default branch.

      Edit them in the **app repo** (`CLAUDE.md`, `docs/**`, `README.md`) — any change made
      here will be overwritten on the next sync.
      EOF
    - cd "$VAULT_DIR"
    - git config user.name "truetone-docs-bot"
    - git config user.email "ci@ayaan47.com"
    - git add -A engineering
    - |
      if git diff --cached --quiet; then
        echo "No doc changes to mirror."
        exit 0
      fi
    # Single-quoted: a bare ": " inside an unquoted YAML scalar parses this line
    # as a mapping instead of a script string.
    - 'git commit -m "sync(engineering): mirror app-repo docs @ ${CI_COMMIT_SHORT_SHA}"'
    - git push origin HEAD:main
