<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="TrueTone — your real shade, built for every tone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F2"/>
      <stop offset="1" stop-color="#F1E9DE"/>
    </linearGradient>
    <!-- A spectrum of skin tones across the full range — the whole point of the product. -->
    <linearGradient id="tones" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#F4D9BE"/>
      <stop offset="0.25" stop-color="#D8A97B"/>
      <stop offset="0.5" stop-color="#A9713F"/>
      <stop offset="0.75" stop-color="#7A4A28"/>
      <stop offset="1"   stop-color="#4A2C1A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <g transform="translate(96,92)">
    <circle cx="16" cy="16" r="16" fill="#2f7d52"/>
    <text x="46" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#221F1A" letter-spacing="0.5">truetone</text>
  </g>

  <!-- headline -->
  <text x="96" y="300" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="800" fill="#221F1A" letter-spacing="-1">your real shade,</text>
  <text x="96" y="392" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="800" fill="#2f7d52" letter-spacing="-1">for every tone.</text>

  <!-- subhead -->
  <text x="98" y="452" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="30" fill="#5c554b">one selfie. your tone and undertone, in seconds.</text>

  <!-- tone spectrum -->
  <rect x="96" y="512" width="1008" height="26" rx="13" fill="url(#tones)"/>

  <!-- footer badges -->
  <text x="96" y="586" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#8a8378">iphone · united states · 18+ · cosmetic, not a medical device</text>
</svg>
