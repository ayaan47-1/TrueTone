<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Leave the TrueTone list</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="mesh" aria-hidden="true">
  <i class="m1"></i><i class="m4"></i>
</div>

<div class="wrap">
  <header>
    <a class="mark" href="/" aria-label="truetone"><span class="swatches" aria-hidden="true"><span class="sw sw1"></span><span class="sw sw2"></span><span class="sw sw3"></span><span class="sw sw4"></span></span><span class="wordmark">truetone</span></a>
  </header>

  <section class="glass signup" style="margin-top:64px">
    <h2>Leave the list.</h2>
    <p class="lede">One tap and your email is deleted outright — not flagged, not archived.</p>

    <div class="embed">
      <form id="leave-form">
        <button id="submit" type="submit">Remove my email</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <noscript>
        <p class="status" data-tone="err">This page needs JavaScript. Reply to any email from us instead.</p>
      </noscript>
    </div>
  </section>

  <footer class="foot">
    <p><a href="/">← Back to TrueTone</a></p>
  </footer>
</div>

<script src="/config.js"></script>
<script type="module" src="/unsubscribe.js"></script>
</body>
</html>
